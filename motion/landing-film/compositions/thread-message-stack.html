<!-- hyperframes-registry-item: thread-message-stack -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Thread Message Stack</title>
  </head>
  <body>
    <template id="tms-template">
      <div
        id="tms-root"
        data-composition-id="thread-message-stack"
        data-start="0"
        data-duration="8"
        data-width="1920"
        data-height="1080"
      >
        <style>
          #tms-root,
          #tms-root * {
            box-sizing: border-box;
          }

          #tms-root {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            container-type: size;
            isolation: isolate;
            background: transparent;
            color: #f8fafc;
            font-family: -apple-system, "Helvetica Neue", "Segoe UI", sans-serif;
            --tms-out-fill: #1769ff;
            --tms-out-ink: #ffffff;
            --tms-in-fill: rgba(16, 22, 38, 0.96);
            --tms-in-ink: #f8fafc;
          }

          #tms-roll,
          #tms-scrim,
          #tms-view {
            position: absolute;
            inset: 0;
          }

          #tms-roll {
            overflow: hidden;
            background: transparent;
            transform: none;
            will-change: auto;
          }

          #tms-scrim {
            background: transparent;
          }

          #tms-view {
            overflow: hidden;
            -webkit-mask-image: linear-gradient(to bottom, transparent 7%, #000 22%, #000 100%);
            mask-image: linear-gradient(to bottom, transparent 7%, #000 22%, #000 100%);
          }

          #tms-column {
            position: absolute;
            inset: 0;
          }

          .tms-row {
            position: absolute;
            right: 14%;
            bottom: 16%;
            left: 670px;
            display: flex;
            flex-direction: column;
            opacity: 0;
            will-change: transform, opacity;
          }

          .tms-row[data-side="incoming"] {
            align-items: flex-start;
          }

          .tms-row[data-side="outgoing"] {
            align-items: flex-end;
          }

          .tms-sender {
            min-height: 24px;
            padding: 0 1cqw 0.45cqw;
            color: #ffffff;
            font-size: clamp(13px, 1.25cqw, 24px);
            font-weight: 700;
            line-height: 1;
            text-shadow: 0 3px 12px rgba(0, 0, 0, 0.72);
          }

          .tms-bubble {
            max-width: min(72%, 920px);
            padding: clamp(12px, 1.25cqw, 24px) clamp(18px, 2cqw, 38px);
            border-radius: clamp(22px, 2.2cqw, 42px);
            font-size: clamp(20px, 2.2cqw, 42px);
            font-weight: 500;
            letter-spacing: -0.015em;
            line-height: 1.3;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
          }

          .tms-row[data-side="incoming"] .tms-bubble {
            color: var(--tms-in-ink);
            background:
              linear-gradient(180deg, rgba(255, 255, 255, 0.14), rgba(0, 0, 0, 0.05)),
              var(--tms-in-fill);
            box-shadow: 0 12px 34px rgba(0, 0, 0, 0.3);
            transform-origin: 0 100%;
          }

          .tms-row[data-side="outgoing"] .tms-bubble {
            color: var(--tms-out-ink);
            background:
              linear-gradient(180deg, rgba(255, 255, 255, 0.2), rgba(0, 0, 0, 0.17)),
              var(--tms-out-fill);
            box-shadow: 0 12px 38px rgba(0, 0, 0, 0.38);
            transform-origin: 100% 100%;
          }

          #tms-driver {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
          }
        </style>

        <div id="tms-roll" data-layout-ignore></div>
        <div id="tms-scrim" data-layout-ignore></div>
        <div id="tms-view"><div id="tms-column"></div></div>
        <div
          id="tms-driver"
          class="clip"
          data-start="0"
          data-duration="8"
          data-track-index="0"
        ></div>

        <div hidden data-hf-primitive-data>
          { "messages": [ { "side": "incoming", "text": "Can you help me choose a gift?", "sender":
          "Customer · Instagram" }, { "side": "outgoing", "text": "Of course — who are you shopping for?" }, { "side":
          "incoming", "text": "A friend who loves coffee." }, { "side": "outgoing", "text": "I can help you find a few options." }
          ], "stagger": 1.18, "hold": 1 }
        </div>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            window.__timelines = window.__timelines || {};
            var root = document.getElementById("tms-root");
            var column = document.getElementById("tms-column");
            var roll = document.getElementById("tms-roll");
            var data = JSON.parse(
              root
                .querySelector("[data-hf-primitive-data]")
                .textContent.replace(/\s*[\r\n]+\s*/g, " "),
            );
            var messages = data.messages;
            var duration = Number(root.dataset.duration || 8);
            var available = Math.max(0.2, duration - Math.max(0, Number(data.hold || 0)) - 0.35);
            var requestedStagger = Math.max(0, Number(data.stagger == null ? 0.72 : data.stagger));
            var stagger =
              messages.length <= 1 ? 0 : Math.min(requestedStagger, available / messages.length);
            var start = 0.25;
            var rows = [];

            messages.forEach(function (message, index) {
              var row = document.createElement("div");
              row.id = "tms-message-" + index;
              row.className = "tms-row";
              row.dataset.side = message.side;
              if (message.sender !== undefined) {
                var sender = document.createElement("div");
                sender.className = "tms-sender";
                sender.textContent = message.sender;
                row.appendChild(sender);
              }
              var bubble = document.createElement("div");
              bubble.className = "tms-bubble";
              bubble.textContent = message.text;
              row.appendChild(bubble);
              column.appendChild(row);
              rows.push(row);
            });

            var heights = rows.map(function (row) {
              return Math.max(118, row.offsetHeight || 118) + 22;
            });
            var tl = gsap.timeline({ paused: true });
            tl.set("#tms-view", { opacity: 1 }, 0);

            rows.forEach(function (row, index) {
              var at = start + index * stagger;
              var direction = row.dataset.side === "incoming" ? -1 : 1;
              tl.fromTo(
                row,
                { x: direction * 34, y: 0, scale: 0.94, opacity: 0 },
                { x: 0, y: 0, scale: 1, opacity: 1, duration: 0.28, ease: "back.out(1.45)" },
                at,
              );
              var offset = 0;
              for (var previous = index - 1; previous >= 0; previous -= 1) {
                offset += heights[previous + 1];
                tl.to(rows[previous], { y: -offset, duration: 0.24, ease: "power3.out" }, at);
              }
            });

            tl.to("#tms-view", { opacity: 0, duration: 0.32, ease: "power2.in" }, Math.max(0, duration - 0.34));

            window.__timelines["thread-message-stack"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
